[project]
name = "dates"
version = "0.1.0"
description = "Diagrams of Annotated T2T Eukaryotic Sequences: publication plots of annotated fungal genomes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.84",
    "pycirclize>=1.9",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
dates = "dates.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dates"]
